/* lobby (GDD-ONLINE): the game's palette and serif stack, radius 14, 1-px border, no backdrop-filter; buttons >= 44 px tall for touch */
#lobby{position:fixed;left:50%;top:4%;transform:translateX(-50%);width:min(92vw,440px);box-sizing:border-box;background:rgba(5,8,20,.78);border:1px solid rgba(242,232,213,.18);border-radius:14px;color:#f2e8d5;padding:20px 26px 20px;font:500 16px 'Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman',serif;letter-spacing:.04em;cursor:auto;user-select:text;-webkit-user-select:text;z-index:2;box-shadow:0 24px 70px rgba(0,0,0,.4)}
#lobby .ttl{display:flex;align-items:center;justify-content:space-between;font-size:13px;letter-spacing:.24em;opacity:.62;padding-bottom:12px;margin-bottom:18px;border-bottom:1px solid rgba(242,232,213,.12)}
#lobby .link{display:inline-flex;align-items:center}
#lobby .link i{display:inline-block;width:6px;height:6px;border-radius:50%;background:#bfefff;box-shadow:0 0 7px rgba(191,239,255,.8)}
#lobby .link i+i{background:#ffc0d0;box-shadow:0 0 7px rgba(255,192,208,.8)}
#lobby .link b{display:inline-block;width:18px;height:1px;background:rgba(242,232,213,.5)}
#lobby .lbl{font-size:12px;letter-spacing:.22em;opacity:.55;margin:2px 0 8px}
#lobby .code{font-size:46px;line-height:1.1;letter-spacing:.3em;text-indent:.15em;margin:8px 0 6px;color:#fff6e6;text-shadow:0 0 18px rgba(191,239,255,.25)}
#lobby .verbs{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
#lobby .row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
#lobby button{flex:1 1 auto;min-height:44px;padding:10px 18px;border:1px solid rgba(242,232,213,.3);border-radius:10px;cursor:pointer;background:rgba(255,255,255,.03);color:#f2e8d5;font:inherit;letter-spacing:.08em;transition:border-color .2s,background .2s}
#lobby button:hover{border-color:rgba(242,232,213,.65);background:rgba(255,255,255,.07)}
#lobby a{cursor:pointer;opacity:.7;text-decoration:none;border-bottom:1px solid rgba(242,232,213,.35);font-size:13px;letter-spacing:.16em;padding-bottom:1px;transition:opacity .2s}
#lobby a:hover{opacity:1}
#lobby input{width:6.5em;margin:6px 0 8px;padding:2px 0 4px;font:inherit;font-size:34px;line-height:1.1;letter-spacing:.3em;text-transform:uppercase;background:none;border:0;border-bottom:1px solid rgba(242,232,213,.4);color:#fff6e6;outline:none;caret-color:#bfefff;transition:border-color .2s}
#lobby input:focus{border-bottom-color:rgba(191,239,255,.8)}
#lobby textarea{width:100%;box-sizing:border-box;height:64px;margin:6px 0 8px;background:rgba(255,255,255,.05);color:#f2e8d5;border:1px solid rgba(242,232,213,.2);border-radius:8px;font:12px monospace;padding:6px}
#lobby .st{margin-top:14px;opacity:.85;min-height:1.4em}
#lobby .st:empty{display:none}
#lobby .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#7fe3ff;box-shadow:0 0 8px rgba(127,227,255,.8);margin-right:10px;vertical-align:middle;animation:breathe 2s ease-in-out infinite}

@media (max-width:480px){#lobby{top:7%;padding:16px 20px 16px}#lobby .verbs{flex-direction:column}#lobby .code{font-size:40px}#lobby input{font-size:28px}}
