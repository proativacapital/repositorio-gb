<!doctype html><html><body style="margin:0"><canvas id=c></canvas><script>
const c=document.getElementById('c'),x=c.getContext('2d');function rs(){c.width=innerWidth;c.height=innerHeight}rs();addEventListener('resize',rs);
let t=0;function loop(){t+=0.016;x.fillStyle='#000';x.fillRect(0,0,c.width,c.height);for(let i=0;i<200;i++){x.fillStyle=`hsl(${i*2+t*50},80%,60%)`;x.beginPath();x.arc(c.width/2+Math.cos(t+i)*i*2,c.height/2+Math.sin(t*1.3+i)*i*2,4,0,7);x.fill()}requestAnimationFrame(loop)}loop();
</script></body></html>
