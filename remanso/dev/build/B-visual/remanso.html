      if (!this.g3Done && (t >= K.ACT1_G3_AT || (g2.state !== 'PENDING' && g2.state !== 'STAMPING' && g2.state !== 'LIVE' && g2.state !== 'FADING'))) { this.g3Done = true; this.stampGlyph('G3', K.ACT1_CROSS); }
    } else if (act.id === 'act2') {
      if (t >= 1) { this.stampGlyph('G4', 0); this.stampGlyph('G5', 0); }
      if (!this.sky2Done && t >= act.cap * K.ACT2_SKY_AT) { this.sky2Done = true; SKY.set(act.sky2, 0, true); }
    } else if (act.id === 'act3') {
      if (t >= 1) this.stampGlyph('G6', 0);
      SKY.predawn = Math.min(1, t / 20);
    }
    if (stepNo % 6 === 0) WEATHER.tells();
    // cap: morning approaches
    if (act.cap > 0) {
      const warn = t >= act.cap - K.CAP_WARN;
      if (warn && !this.capWarn) { this.capWarn = true; WEATHER.tideScale = K.CAP_TIDE; }
      if (warn) SKY.light = Math.min(K.CAP_SKY, SKY.light + dt * K.CAP_SKY / 3);
      if (t >= act.cap && this.capT < 0) {
        this.capT = t;
        for (const id of act.glyphs) { const g = GLYPHS.byId(id); if (g.state === 'LIVE' || g.state === 'FADING') GLYPHS.wisp(g); if (g.state === 'WISP') GLYPHS.permanent(g); }
      }
      if (this.capT >= 0 && t - this.capT >= K.CAP_PAUSE) { this.next(); return; }
    }
    // exit when every glyph of the act is resolved
    let all = true; for (const id of act.glyphs) if (!this.resolved(GLYPHS.byId(id))) all = false;
    if (all && this.doneT < 0) this.doneT = t;
    if (this.doneT >= 0 && t - this.doneT >= K.ACT_MIN_LEN) { this.next(); return; }
    // stuck nudge and idle demonstration
    if (t - this.lastChangeT >= K.NUDGE_T && t >= this.nudgeNext) {
      this.nudgeNext = t + K.NUDGE_REPEAT;
      const g = this.target(); if (g) { WEATHER.nudge(g); g.nudgeUntil = t + K.NUDGE_DUR; g.ghostA *= K.NUDGE_GHOST; GLYPHS.ghostDirty = true; }
    }
    for (const g of GLYPHS.list) if (g.nudgeUntil && t > g.nudgeUntil) { g.nudgeUntil = 0; g.ghostA = g.state === 'LIVE' ? 1 : g.state === 'FADING' ? 0.6 : 0.3; GLYPHS.ghostDirty = true; }
    if (T - INPUT.lastInputT >= K.IDLE_T && t >= this.idleNext) { this.idleNext = t + K.DEMO_REPEAT; this.demo(); }
  },
  target() {
    let best = null; const pr = { FADING: 0, WISP: 1, LIVE: 2 };
    for (const id of this.actGlyphs()) { const g = GLYPHS.byId(id); if (!(g.state in pr)) continue; if (!best || pr[g.state] < pr[best.state] || (pr[g.state] === pr[best.state] && g.cohN < best.cohN)) best = g; }
    return best;
  },
  demo() {
    const g = this.target(); if (!g || findPtr('demo')) return;
    const p = allocPtr('demo', 'demo'); if (!p) return;
    const c = GLYPHS.centerCss(g); p.x = p.lx = c.x; p.y = p.ly = c.y; p.down = true; p.demoT = 0;
    this.demoP = p; this.demoHold = K.DEMO_HOLD + 0.4;
  },
  next() { if (this.actIdx < K.ACTS.length - 1) this.startAct(this.actIdx + 1); else this.startDawn(); },
  startDawn() {
    this.phase = 'dawn'; this.act = null; this.actT = 0; this.dawnD = 0; this.blendReady = false; this.dawnText = false; this.dawnAudio = false;
    WEATHER.tideScale = 1; WEATHER.pair = false; WEATHER.set(0, 40, 0, 0, true); SKY.light = 0; SKY.predawn = 0; SKY.set(K.DAWN_SKY[0], 0, false);
    for (const g of GLYPHS.list) { if (g.state === 'WISP') GLYPHS.permanent(g); else if (g.state === 'LIVE' || g.state === 'FADING') { GLYPHS.wisp(g); GLYPHS.permanent(g); } }
    for (let i = 0; i < PTR.length; i++) { PTR[i].s = 0; PTR[i].d = 0; PTR[i].wasOpen = false; }
    AUDIO.padOff();
  },
  dawnStep(dt) {
    const t = this.actT, N = G.N;
    this.dawnRewind = t < K.DAWN_REWIND;
    if (this.dawnRewind) { this.dawnD += K.REWIND_DAWN * dt; this.globalRewind(this.dawnD); }
    if (t >= K.DAWN_REWIND && !this.blendReady) { this.blendReady = true; this.buildDawnTargets(); }
    if (this.blendReady && t < K.DAWN_BLEND) {
      const d0 = F.d0, d1 = F.d1, dW = F.dW, a0 = F.dawn0, a1 = F.dawn1, aW = F.dawnW, k = K.DAWN_BLEND_K;
      for (let i = 0; i < N; i++) { d0[i] += (a0[i] - d0[i]) * k; d1[i] += (a1[i] - d1[i]) * k; dW[i] += (aW[i] - dW[i]) * k; }

    else if (t < K.DAWN_FOSSIL) FOSSIL.alpha = lerp(K.FOSSIL_ALPHA, K.FOSSIL_DAWN, easeInOutSine((t - K.DAWN_BLEND) / (K.DAWN_FOSSIL - K.DAWN_BLEND)));
    else FOSSIL.alpha = K.FOSSIL_DAWN * (1 - easeInOutSine(Math.min(1, (t - K.DAWN_BLEACH) / 10)));

      const d0 = F.d0, d1 = F.d1, dW = F.dW, k = 0.99;
      for (let i = 0; i < N; i++) { d0[i] *= k; d1[i] *= k; dW[i] *= k; }
      MOTES.mist = true;
    }
    if (t >= K.DAWN_STARS_OUT) SKY.alpha = Math.max(0, 1 - (t - K.DAWN_STARS_OUT) / (K.DAWN_LEN - K.DAWN_STARS_OUT));
    if (t >= K.DAWN_TEXT && !this.dawnText) { this.dawnText = true; this.showText('A manhã não devolve. Só ilumina.', 'Morning gives nothing back. It only lights.', 0.14 * L.cssH); }
    if (stepNo % 4 === 0) {
      if (t < K.DAWN_BLEACH) { const e = easeInOutSine(t / K.DAWN_BLEACH); SKY.setRgb(mixRgb(hexRgb(K.DAWN_SKY[0]), hexRgb(K.DAWN_SKY[1]), e), e); }
      else { const e = Math.min(1, (t - K.DAWN_BLEACH) / 10); SKY.setRgb(mixRgb(hexRgb(K.DAWN_SKY[1]), hexRgb(K.DAWN_SKY[2]), e), 1); RENDER.rebuildWater(e); }
    }
    if (t >= K.DAWN_LEN) this.startEpilogue();
  },
  globalRewind(d) {
    HIST.seek(d); if (!HIST.valid) return;
    const N = G.N, dyH = HIST.dye, veH = HIST.vel, fr = HIST.frac, fa = 1 - fr, a3 = HIST.slotA * N * 3, b3 = HIST.slotB * N * 3, a2 = HIST.slotA * N * 2, b2 = HIST.slotB * N * 2;
    const u = F.u, v = F.v, d0 = F.d0, d1 = F.d1, dW = F.dW, rc = F.recall, kd = K.RECALL_DYE, kv = K.RECALL_VEL, kvk = K.RECALL_VEL_K;
    for (let i = 0; i < N; i++) {
      const e0 = (dyH[a3 + i] * fa + dyH[b3 + i] * fr) / 128 - d0[i], e1 = (dyH[a3 + N + i] * fa + dyH[b3 + N + i] * fr) / 128 - d1[i], eW = (dyH[a3 + 2 * N + i] * fa + dyH[b3 + 2 * N + i] * fr) / 128 - dW[i];
      d0[i] += kd * e0; d1[i] += kd * e1; dW[i] += kd * eW;
      let m = Math.abs(e0) + Math.abs(e1) + Math.abs(eW); m *= 3; if (m > 1) m = 1; if (m > rc[i]) rc[i] = m;
      const hu = (veH[a2 + i] * fa + veH[b2 + i] * fr) / 3, hv = (veH[a2 + N + i] * fa + veH[b2 + N + i] * fr) / 3;
      u[i] += (-kvk * hu - u[i]) * kv; v[i] += (-kvk * hv - v[i]) * kv;
    }
  },
  buildDawnTargets() {
    const N = G.N, a0 = F.dawn0, a1 = F.dawn1, aW = F.dawnW; a0.fill(0, 0, N); a1.fill(0, 0, N); aW.fill(0, 0, N);
    for (const g of GLYPHS.list) {
      if (g.state === 'PENDING') continue;
      GLYPHS.geometry(g);
      const k = g.state === 'STAR' ? 1 : g.state === 'DIM' ? K.DIM_BRIGHT : 0, dst = g.state === 'STAR' || g.state === 'DIM' ? (g.slot === 0 ? a0 : a1) : aW, m = g.maskThick, kk = k > 0 ? k : 0.8;
      for (let i = 0; i < N; i++) { const t = m[i] * kk; if (t > dst[i]) dst[i] = t; }
    }
  },
  startEpilogue() {
    this.phase = 'epilogue'; this.actT = 0; this.act = null; this.dawnRewind = false; MOTES.mist = false; this.skyHold = 0;
    F.d0.fill(0); F.d1.fill(0); F.dW.fill(0); F.recall.fill(0); F.ghost.fill(0); HIST.count = 0;
    WEATHER.set(K.EPI_TIDE, 40, 1, K.EPI_VPK, true); SKY.setRgb(hexRgb(K.EPI_SKY), 1); SKY.alpha = 0; SKY.light = 0; SKY.dark = 0; RENDER.rebuildWater(1); FOSSIL.alpha = 0;
  },
  epilogueStep(dt) {
    let hold = false;
    for (let i = 0; i < PTR.length; i++) { const p = PTR[i]; if (p.alive && p.down && p.inSky && p.speed < K.STILL_SPEED) hold = true; }
    this.skyHold = hold ? this.skyHold + dt : 0;
    if (this.skyHold >= K.EPI_RESTART_HOLD && !this.fading) this.restart();
  },
  restart() { this.fading = true; this.restarting = false; this.fadeT = 0; },
  reset() {
    clearFields(); HIST.count = 0; HIST.head = 0; GLYPHS.reset(); GLYPHS.slotCol[0] = K.COL.amber; GLYPHS.slotCol[1] = K.COL.rose; GLYPHS.slotGlyph[0] = GLYPHS.slotGlyph[1] = null;
    SKY.reset(); SKY.light = 0; SKY.dark = 0; SKY.predawn = 0; SKY.set('#02030a', 0, false); FOSSIL.clear(); MOTES.reseed(); MOTES.mist = false;
    WEATHER.init(); WEATHER.set(0, 40, 0, 0, false); WEATHER.rampT = 99; WEATHER.update(0); RENDER.rebuildWater(0); RENDER.ghostBreath = 1;
    for (let i = 0; i < PTR.length; i++) { const p = PTR[i]; p.s = 0; p.d = 0; p.holdT = 0; p.wasOpen = false; if (p.kind !== 'real') p.alive = false; }
    AUDIO.reset(); INPUT.pressed = false; this.openingShown = false; this.textT = -1; this.flashT = -1; this.rippleN = 0; this.lostT = -1; this.dawnRewind = false; this.skyHold = 0;
    this.startAct(0);
  },
  skipTo(name) {
    const order = ['act0', 'act1', 'act2', 'act3', 'dawn', 'epilogue'], idx = order.indexOf(name);
    if (idx < 0) return;
    if (this.phase === 'calibrate') { this.pendingSkip = name; return; }
    this.fading = false; this.restarting = false; this.fadeAlpha = 0;
    this.reset();
    const actN = idx < 4 ? idx : 4;
    for (const g of GLYPHS.list) { if (g.def.act < actN) { GLYPHS.geometry(g); g.state = 'STAR'; g.dim = false; SKY.launch(g); SKY.stars[g.idx].bright = 1; SKY.flightN = 0; } }
    if (idx < 4) { this.startAct(idx); if (idx > 0) { SKY.fadeT = 99; WEATHER.rampT = 99; WEATHER.update(0); SKY.rebuild(); } }
    else { this.startAct(3); this.startDawn(); if (idx === 5) this.startEpilogue(); }
  },
  demoStep(dt) {
    const p = this.demoP; if (!p || !p.alive) { this.demoP = null; return; }
    p.demoT += dt;
    if (p.demoT >= this.demoHold) { p.down = false; this.demoP = null; }
  },
  drawText() {
    if (this.textT < 0) return;
    const t = this.textT, tin = K.TEXT_IN, hold = K.TEXT_HOLD, tout = K.TEXT_OUT;
    const a = t < tin ? easeInOutSine(t / tin) : t < tin + hold ? 1 : 1 - easeInOutSine((t - tin - hold) / tout);

  }
};

// ---------------------------------------------------------------- LOOP
const Q = {
  step: 0, forced: -1, grain: true, bloomA: true, motes: K.MOTES, gs: K.GS_SWEEPS, scaleMul: 1, name: 'high', acc: 0, cnt: 0, restoreN: 0, calRung: 0,
  apply() {
    const s = this.step; this.grain = s < 1; this.bloomA = s < 2; this.motes = s < 3 ? K.MOTES : K.MOTES_DEG; this.gs = s < 4 ? K.GS_SWEEPS : K.GS_SWEEPS_DEG;
    const sm = s < 5 ? 1 : K.SCALE_MIN / K.SCALE_MAX; if (sm !== this.scaleMul) { this.scaleMul = sm; L.dirty = true; }
    this.name = s === 0 ? 'high' : s <= 2 ? 'medium' : s <= 4 ? 'low' : 'lowest';
  },
  sample(jsNorm) {
    if (this.forced >= 0) return;
    this.acc += jsNorm; this.cnt++;
    if (this.cnt < K.LADDER_FRAMES) return;
    const mean = this.acc / this.cnt; this.acc = 0; this.cnt = 0;
    if (mean > K.LADDER_JS && this.step < 6) { this.step++; this.restoreN = 0; this.apply(); }
    else if (mean < K.LADDER_JS * 0.66) { this.restoreN += K.LADDER_FRAMES; if (this.restoreN >= K.LADDER_RESTORE_FRAMES && this.step > 0) { this.step--; this.restoreN = 0; this.apply(); } }
    else this.restoreN = 0;
  },
  force(q) {
    const map = { auto: -1, high: 0, medium: 2, low: 4, lowest: 5 };
    const v = typeof q === 'number' ? clamp(q | 0, 0, 6) : (q in map ? map[q] : -1);
    this.forced = v; if (v >= 0) this.step = v; this.acc = 0; this.cnt = 0; this.apply();
  }
};
const STATS = { frame: new Float32Array(120), step: new Float32Array(120), render: new Float32Array(120), i: 0, n: 0, steps: 0 };
const CAL = { samples: [], drops: 0 };
let lastNow = 0, acc = 0, rafId = 0, timeScale = 1;
function stepOnce() {
  fluidStep(); REMANSO.stepSparks(); SKY.step(K.DT); WEATHER.update(K.DT); DIR.demoStep(K.DT); DIR.update(K.DT); T += K.DT;
}
function pct(arr, n, q) { const a = Array.from(arr.subarray(0, n)).sort((x, y) => x - y); return a.length ? a[Math.min(a.length - 1, Math.floor(q * a.length))] : 0; }
function summary(arr, n) { let s = 0, m = 0; for (let i = 0; i < n; i++) { s += arr[i]; if (arr[i] > m) m = arr[i]; } return { avg: +(s / Math.max(1, n)).toFixed(2), p95: +pct(arr, n, 0.95).toFixed(2), max: +m.toFixed(2) }; }
function tick(now) {
  rafId = requestAnimationFrame(tick);
  frameNo++; realNow = now;
  let resized = false; if (L.dirty) { applyResize(); resized = true; }
  const frameDt = lastNow ? now - lastNow : 16.7;
  const dtReal = lastNow ? Math.min(frameDt / 1000, K.ACC_CLAMP * Math.max(1, timeScale)) : 0;
  lastNow = now; acc += dtReal * timeScale;
  INPUT.frame(now);
  const maxSteps = timeScale > 1 ? K.MAX_STEPS_FAST : K.MAX_STEPS;
  const t0 = performance.now(); let steps = 0;
  while (acc >= K.DT && steps < maxSteps) { stepOnce(); acc -= K.DT; steps++; }
  if (acc > 2 * K.DT) acc = 0;
  const t1 = performance.now();
  if (steps > 0 || resized) RENDER.frame();
  const t2 = performance.now();
  if (steps > 0) {
    const i = STATS.i; STATS.frame[i] = frameDt; STATS.step[i] = (t1 - t0) / steps; STATS.render[i] = t2 - t1; STATS.i = (i + 1) % 120; if (STATS.n < 120) STATS.n++; STATS.steps += steps;
    if (!G.calibrated) {
      if (stepNo >= K.CAL_START) CAL.samples.push((t1 - t0) / steps);
      if (CAL.samples.length >= K.CAL_END - K.CAL_START) {
        const sorted = CAL.samples.slice().sort((a, b) => a - b), p75 = sorted[Math.floor(sorted.length * 0.75)];
        if (p75 > K.CAL_MS && CAL.drops < K.CAL_MAX_DROPS && G.rung < 2) { CAL.drops++; deriveGrid(G.rung + 1); CAL.samples.length = 0; }
        else { G.calibrated = true; Q.calRung = G.rung; CAL.samples.length = 0; DIR.startAct(0); if (DIR.pendingSkip) { const ps = DIR.pendingSkip; DIR.pendingSkip = null; DIR.skipTo(ps); } }

}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (rafId) cancelAnimationFrame(rafId); rafId = 0; AUDIO.suspend(); releaseAll(); }
  else if (!rafId) { lastNow = 0; acc = 0; AUDIO.resume(); rafId = requestAnimationFrame(tick); }
});

// ---------------------------------------------------------------- BOOT
function boot() {
  const m = /seed=(\d+)/.exec(location.hash || ''); seedRng(m ? +m[1] : 20240901);
  buildGrain(); applyResize();
  deriveGrid((navigator.hardwareConcurrency || 4) <= 2 ? 1 : 0);
  SKY.set('#02030a', 0, false); WEATHER.set(0, 40, 0, 0, false); WEATHER.rampT = 99;
  const skyOut = { stars: 0, dim: 0, wisps: 0 };
  window.__game = {
    version: '1.0',
    snapshot() {
      const glyphs = [];
      for (const g of GLYPHS.list) { if (g.state === 'PENDING') continue; glyphs.push({ id: g.id, state: g.state, coh: +g.coh.toFixed(3), cohN: +g.cohN.toFixed(3), eligible: g.eligible, center: GLYPHS.centerCss(g), extentPx: Math.round(g.def.E * L.lmin) }); }

      for (let i = 0; i < PTR.length; i++) { const p = PTR[i]; if (!p.alive) continue; if (p.kind === 'real') pointers++; if (p.s > K.S_OPEN) remansos.push({ x: Math.round(p.x), y: Math.round(p.y), r: Math.round(p.Reff), s: +p.s.toFixed(2), d: +p.d.toFixed(2), strain: +p.strainAvg.toFixed(2) }); }

    },
    flowAt(x, y) { return flowAtCss(+x || 0, +y || 0); },
    setTimeScale(k) { timeScale = clamp(+k || 1, 0.1, 4); acc = 0; },
    skipToPhase(name) { DIR.skipTo(String(name)); },
    setSeed(n) { seedRng(+n || 1); },
    setQuality(q) { Q.force(q); },

    }

}
boot();
